# dsh-fleet 的补丁层。
#
# 这个插件不替换任何上游行。它的全部接入点都是运行时的：
#
# - `webServer.register` 开一个 `/fleet/api` 管理面；
# - `ctx.inject` 拿到已经组装好的 `sessionController`、`workspaceController`、
#   `workspaceFiles`、`terminalController`，在**实例**上装 own property。Gateway
#   在 dispatch 时用 `Reflect.get(view, name)` 取值，在 discovery 时只读类原型上的
#   `@Remote` 描述符，所以覆写生效而声明面不变；
# - `typert.lookups.configure('workspaceFileScope', …)` 让远端 session 的
#   `fleet_<node>_<id>` 能被解析成文件作用域，本地 id 原样委托给上游 provider。
#
# 因此这里只插入插件自己的一行。上游的 `/api`、`/api/remote.mux`、sidebar 槽位
# 一概不碰 —— 混排是通过让 `session/list` 与 `workspace/follow` 多返回几行实现的，
# 而不是通过在 UI 上再开一个面板。
- insert:
    - id: dsh-fleet
      name: '@local/dsh-fleet'
      config:
        enabled: true
        autoConnect: true
