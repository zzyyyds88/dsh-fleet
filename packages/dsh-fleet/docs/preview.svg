  <rect x="16" y="30" width="608" height="12" fill="#EDEFF8"/>
  <circle cx="32" cy="29" r="4" fill="#C9D0E4"/>
  <circle cx="46" cy="29" r="4" fill="#C9D0E4"/>
  <circle cx="60" cy="29" r="4" fill="#C9D0E4"/>

  <!-- sidebar -->
  <rect x="16" y="42" width="176" height="242" fill="#F8F9FD"/>
  <path d="M192 42v242" stroke="#E6E9F3"/>
  <rect x="28" y="54" width="112" height="8" rx="4" fill="#C2C9DC"/>

  <!-- local workspace group -->
  <rect x="28" y="74" width="12" height="10" rx="2" fill="#247BBF"/>
  <rect x="46" y="76" width="74" height="6" rx="3" fill="#8E97AE"/>
  <rect x="40" y="92" width="126" height="14" rx="4" fill="#E4EEF9"/>
