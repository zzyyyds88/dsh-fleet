<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300" role="img" aria-label="侧栏里并列显示本地工作区与两台远程节点的工作区，以及节点设置页">
  <desc>Left: a sidebar listing local workspaces and remote-node workspaces side by side. Right: the settings page with two connected nodes and their per-plugin switches.</desc>
  <rect width="640" height="300" fill="#F5F6FC"/>

  <!-- window -->
  <rect x="16" y="16" width="608" height="268" rx="10" fill="#FFFFFF" stroke="#DFE3EF"/>
