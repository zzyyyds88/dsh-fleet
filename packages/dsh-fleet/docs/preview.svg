  <rect x="212" y="76" width="300" height="7" rx="3.5" fill="#D8DDEB"/>

  <!-- node card 1 -->
  <rect x="212" y="96" width="396" height="72" rx="8" fill="#FFFFFF" stroke="#E3E7F2"/>
  <circle cx="232" cy="116" r="6" fill="#3BA45C"/>
