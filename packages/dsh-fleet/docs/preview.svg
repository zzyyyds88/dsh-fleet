  <!-- remote node group 1 -->
  <rect x="28" y="120" width="12" height="10" rx="2" fill="#F0A32E"/>
  <rect x="46" y="122" width="86" height="6" rx="3" fill="#8E97AE"/>
  <rect x="40" y="138" width="126" height="12" rx="4" fill="#F3F5FB"/>
  <rect x="48" y="142" width="84" height="5" rx="2.5" fill="#6B748C"/>
  <rect x="40" y="154" width="126" height="12" rx="4" fill="#F3F5FB"/>
  <rect x="48" y="158" width="66" height="5" rx="2.5" fill="#6B748C"/>
  <rect x="40" y="170" width="126" height="12" rx="4" fill="#F3F5FB"/>
  <rect x="48" y="174" width="92" height="5" rx="2.5" fill="#6B748C"/>

  <!-- remote node group 2 -->
  <rect x="28" y="194" width="12" height="10" rx="2" fill="#F0A32E"/>
