name: CI

# The offline layer of `test/run-all.mjs`, and nothing else.
#
# **The suite list is not repeated here.** It used to be, and it drifted: nine suites were
# listed while the offline layer registered sixteen, so `node-patches` — the guard that keeps
# `patches/node/*.patch` and the deviation ledger in agreement — never ran in CI at all, and
# neither did `rnh-lifecycle`, `errors`, `autoconnect`, `packet`, `provision` or `composition`.
# A hand-maintained copy of a list that already exists in code can only rot; `run-all.mjs`
# owns the registry, so CI asks it.
#
# What the offline layer contains: every suite that needs nothing but Node and this package's
# own dependency. Two of the sixteen exit 3 on a machine with no desktop install (`provision`
# and `composition` read `app.asar` through Electron's patched `fs`), and `run-all` reports
# those as SKIP with the reason — not as a pass. The contract and e2e layers need a running
# Host and an SSH-reachable node, so they are not in this job.
#
# `ssh2` is the one real dependency (only `src/ssh/connection.js` imports it). Most suites
# reach it not at all; `version-unit` and `packet-unit` do, through
# `remote/daemon.js` → `ssh/connection.js`. So dependencies are installed, but with
# `--ignore-scripts`: ssh2's optional native helper (`cpu-features`) then never builds, and a
# suite that starts needing a build shows up as a failure rather than being hidden by a
# working install.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    name: Offline suites (no DSH, no node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install the one runtime dependency, without build scripts
        working-directory: packages/dsh-remote-node-harness
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Offline layer
        working-directory: packages/dsh-remote-node-harness
        # No `DSH_INSTALL_DIR` on a bare runner: the two app.asar suites skip themselves and
        # say so. `run-all` exits non-zero on any FAIL and prints the skips separately.
        run: node test/run-all.mjs --layer offline

      - name: The manifest still packs
        working-directory: packages/dsh-remote-node-harness
        run: npm pack --dry-run