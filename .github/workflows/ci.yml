name: CI

# Only the suites that need nothing but Node and this package's own dependency.
#
# `run-all.mjs` has three layers. The offline layer splits again: `provision` and
# `composition` read `app.asar` through Electron's patched `fs`, and the contract and e2e
# layers need a running Host and an SSH-reachable node. What runs here needs neither.
#
# `ssh2` is the one real dependency (only `src/ssh/connection.js` imports it). Most of the
# suites below reach it not at all; `version-unit` does, through
# `remote/daemon.js` → `ssh/connection.js` — measured by running them all in a copy of the
# package with no `node_modules`: only `version-unit` failed, with ERR_MODULE_NOT_FOUND for
# `ssh2`. So dependencies are installed, but with `--ignore-scripts`: ssh2's optional native
# helper (`cpu-features`) then never builds, and a suite that starts needing a build shows up
# as a failure rather than being hidden by a working install.
#
# `fork-runtime-unit` reads the two build scripts as text and checks the trim rules, so it
# needs neither a fork checkout nor a built archive — it runs here for the same reason the
# others do: the rules it pins down (keep the `dsh-web-app` manifest, stage by `overrides`)
# are the ones whose absence produces a runtime that installs fine and cannot boot.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    name: Offline suites (no DSH, no node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install the one runtime dependency, without build scripts
        working-directory: packages/dsh-remote-node-harness
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Unit suites
        working-directory: packages/dsh-remote-node-harness
        run: |
          set -e
          node test/routing-unit.mjs
          node test/routing-extra-unit.mjs
          node test/multipart-unit.mjs
          node test/waterfall-unit.mjs
          node test/version-unit.mjs
          node test/fork-runtime-unit.mjs
          node test/picker-paths-unit.mjs
          node test/install-unit.mjs
          node test/rnh-control-unit.mjs

      - name: The manifest still packs
        working-directory: packages/dsh-remote-node-harness
        run: npm pack --dry-run